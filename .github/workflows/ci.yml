name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  # uWebSockets.js comes from GitHub, installed on purpose; here its test has to run
  uws:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund --ignore-scripts --no-save --allow-git=all "uWebSockets.js@github:uNetworking/uWebSockets.js#v20.71.0"
      - run: npm test -w packages/uws
        env:
          REQUIRE_UWS: "1"
